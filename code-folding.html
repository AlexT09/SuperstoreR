<script>
// Oculta el código de cada gráfica detrás de "Mostrar código" (el ETL queda visible: clase .nofold)
document.querySelectorAll("div.sourceCode").forEach(function (div) {
  if (div.querySelector("pre.nofold") || div.closest("details")) return;
  var details = document.createElement("details");
  details.className = "code-fold";
  details.innerHTML = "<summary>Mostrar código</summary>";
  div.parentNode.insertBefore(details, div);
  details.appendChild(div);
});
</script>
